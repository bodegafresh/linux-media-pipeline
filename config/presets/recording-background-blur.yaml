capture:
  type: gopro_udp
  address: udp://0.0.0.0:8554

gpu:
  backend: opencl

ai:
  engine: onnxruntime
  model_path: assets/models/person-segmentation.onnx

pipeline:
  threads: auto
  queue_size: 4

filters:
  - type: background_blur
    enabled: true
    backend: opencl
    auto_frame: false
    mask_mode: center
    fallback_mask_mode: tracked_center
    mask_width: 0.58
    mask_height: 0.78
    radius: 8
    foreground_threshold: 145
    brightness: 2
    contrast: 1.04
    saturation: 1.03

output:
  type: v4l2
  device: /dev/video20
  pixel_format: RGB24
  width: 1280
  height: 720
  fps: 30
