capture:
  type: gopro_udp
  address: udp://0.0.0.0:8554

gpu:
  backend: opencl

ai:
  engine: onnxruntime
  model_path: assets/models/person-segmentation.onnx

pipeline:
  threads: auto
  queue_size: 4

filters:
  - type: background_blur
    enabled: true
    backend: opencl
    auto_frame: true
    target_fill: 0.52
    max_zoom: 1.18
    mask_mode: onnx
    model_path: assets/models/person-segmentation.onnx
    provider: rocm
    allow_provider_fallback: true
    openvino_device: CPU
    input_shape: 1x3x256x256
    output_shape: 1x1x256x256
    inference_interval: 4
    mask_smoothing: 0.65
    mask_expand: 3
    mask_feather: 5
    invert_mask: true
    keep_largest_component: true
    min_mask_coverage: 0.05
    max_mask_coverage: 0.80
    fallback_mask_mode: tracked_center
    mask_width: 0.78
    mask_height: 1.08
    hint_y_offset: -0.20
    radius: 7
    foreground_threshold: 96
    brightness: 2
    contrast: 1.04
    saturation: 1.03

output:
  type: v4l2
  device: /dev/video20
  pixel_format: RGB24
  width: 1280
  height: 720
  fps: 30
