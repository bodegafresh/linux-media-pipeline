capture:
  type: gopro_udp
  address: udp://0.0.0.0:8554

gpu:
  backend: opencl

ai:
  engine: onnxruntime
  model_path: assets/models/pphumanseg.onnx

pipeline:
  threads: auto
  queue_size: 4

filters:
  - type: background_blur
    enabled: true
    backend: opencl
    auto_frame: true
    target_fill: 0.58
    max_zoom: 1.12
    mask_mode: onnx
    model_path: assets/models/pphumanseg.onnx
    provider: cpu
    allow_provider_fallback: false
    openvino_device: CPU
    input_shape: 1x3x192x192
    output_shape: 1x1x192x192
    inference_interval: 4
    mask_smoothing: 0.35
    mask_expand: 2
    mask_feather: 3
    invert_mask: false
    keep_largest_component: true
    min_mask_coverage: 0.04
    max_mask_coverage: 0.55
    fallback_mask_mode: tracked_center
    mask_width: 0.50
    mask_height: 0.82
    radius: 14
    foreground_threshold: 180
    brightness: 2
    contrast: 1.04
    saturation: 1.03

output:
  type: v4l2
  device: /dev/video20
  pixel_format: RGB24
  width: 1280
  height: 720
  fps: 30
