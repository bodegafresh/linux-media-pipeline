capture:
  type: gopro_udp
  address: udp://0.0.0.0:8554

gpu:
  backend: opencl

pipeline:
  threads: auto
  queue_size: 4

filters:
  - type: identity
    enabled: true
  - type: grayscale
    enabled: false
  - type: negative
    enabled: false
  - type: sepia
    enabled: false
  - type: box_blur
    enabled: false
    radius: 1
  - type: gaussian_blur
    enabled: false
    radius: 1
  - type: sharpen
    enabled: false
    amount: 1.0
  - type: sobel
    enabled: false

output:
  type: v4l2
  device: /dev/video20
