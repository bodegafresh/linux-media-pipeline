capture:
  type: gopro_udp
  address: udp://0.0.0.0:8554

gpu:
  backend: opencl

ai:
  engine: onnxruntime
  model_path: assets/models/pphumanseg.onnx

pipeline:
  threads: auto
  queue_size: 4

filters:
  - type: background_blur
    enabled: true
    backend: opencl
    auto_frame: true
    target_fill: 0.62
    max_zoom: 1.16
    mask_mode: shared_onnx
    shared_mask_id: dual-presenter
    fallback_mask_mode: tracked_center
    mask_width: 0.44
    mask_height: 0.74
    mask_expand: 0
    mask_feather: 1
    radius: 5
    foreground_threshold: 128
    background_mode: blur
    background_color: x111827
    brightness: 4
    contrast: 1.02
    saturation: 1.06

output:
  type: v4l2
  device: /dev/video21
  pixel_format: RGB24
  width: 720
  height: 1280
  fps: 30
