capture:
  type: gopro_udp
  address: udp://0.0.0.0:8554

gpu:
  backend: opencl

ai:
  engine: onnxruntime
  model_path: assets/models/person-segmentation.onnx

pipeline:
  threads: auto
  queue_size: 4

filters:
  - type: auto_frame
    enabled: true
    target_fill: 0.58
    max_zoom: 1.35
    smoothing: 0.88
    dead_zone: 0.06
    foreground_threshold: 128
  - type: color_adjust
    enabled: true
    backend: opencl
    brightness: 1
    contrast: 1.06
    saturation: 1.04

output:
  type: v4l2
  device: /dev/video20
  pixel_format: RGB24
  width: 1280
  height: 720
  fps: 30
