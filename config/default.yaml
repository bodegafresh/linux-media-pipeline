capture:
  type: gopro_udp
  address: udp://0.0.0.0:8554

gpu:
  backend: opencl
  zero_copy: true
  buffer_pool_enabled: true
  buffer_pool_buffers: 4
  vulkan_enabled: false
  vulkan_zero_copy: true

pipeline:
  threads: auto
  queue_size: 4

filters:
  - type: identity
    enabled: true
  - type: grayscale
    enabled: false
  - type: negative
    enabled: false
  - type: sepia
    enabled: false
  - type: box_blur
    enabled: false
    radius: 1
  - type: gaussian_blur
    enabled: false
    radius: 1
  - type: sharpen
    enabled: false
    amount: 1.0
  - type: sobel
    enabled: false
  - type: gamma
    enabled: false
    gamma: 1.0
  - type: exposure
    enabled: false
    stops: 0.0
  - type: contrast
    enabled: false
    factor: 1.0
  - type: brightness
    enabled: false
    offset: 0
  - type: saturation
    enabled: false
    factor: 1.0
  - type: white_balance
    enabled: false
    red_gain: 1.0
    green_gain: 1.0
    blue_gain: 1.0
  - type: temperature
    enabled: false
    amount: 0
  - type: tint
    enabled: false
    amount: 0
  - type: text_overlay
    enabled: false
    text: LMP
    x: 8
    y: 8
  - type: fps_overlay
    enabled: false
    fps: 60.0
    x: 8
    y: 16
  - type: timestamp_overlay
    enabled: false
    x: 8
    y: 24
  - type: histogram
    enabled: false
    draw_overlay: true
    x: 8
    y: 32
    width: 64
    height: 32

output:
  type: v4l2
  device: /dev/video20
